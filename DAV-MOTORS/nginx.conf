worker_processes auto;
pid /var/run/nginx.pid;
# Ошибки Nginx также могут содержать адреса клиентов.
error_log /dev/null crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header Referrer-Policy "no-referrer" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

        location ^~ /api/ {
            return 410;
        }
        location ~ /\. {
            return 404;
        }
        location / {
            limit_except GET { deny all; }
            try_files $uri $uri/ =404;
        }
    }
}
